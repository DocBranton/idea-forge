name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Scratch Postgres for the review-trail integration tests (Lakebase is Postgres).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # package-lock.json is committed; npm ci fails if it drifts from package.json.
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:cad
      - run: npm run test:server
        env:
          CAD_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
